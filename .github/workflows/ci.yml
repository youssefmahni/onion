name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  new-tree:
    name: New tree (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            preset: linux-debug
            cmake_args: ''
            install_pocl: true
          - name: macOS arm64
            os: macos-latest
            preset: macos-release
            cmake_args: -DONION_ENABLE_OPENCL=OFF
            install_pocl: false
          - name: Windows
            os: windows-latest
            preset: windows-msvc
            cmake_args: -DONION_ENABLE_OPENCL=OFF
            install_pocl: false
    steps:
      - uses: actions/checkout@v4
      - name: Enable the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux OpenCL runtime
        if: matrix.install_pocl
        run: sudo apt-get update && sudo apt-get install --yes pocl-opencl-icd ocl-icd-opencl-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake ${{ matrix.cmake_args }} --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  macos-x86_64-compat:
    name: macOS x86_64 / 12.0 compatibility build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure for Intel macOS 12
        run: >-
          cmake --preset macos-release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        run: cmake --build --preset macos-release
      - name: Verify Intel macOS 12 target
        run: |
          architectures="$(lipo -archs build/macos-release/onion_smoke)"
          printf '%s\n' "$architectures"
          test "$architectures" = "x86_64"
          build_version="$(otool -l build/macos-release/onion_smoke | grep -A4 LC_BUILD_VERSION)"
          printf '%s\n' "$build_version"
          printf '%s\n' "$build_version" | grep -E '^[[:space:]]+minos 12\.0$'

  new-tree-asan-ubsan:
    name: New tree (Linux ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux OpenCL runtime
        run: sudo apt-get update && sudo apt-get install --yes pocl-opencl-icd ocl-icd-opencl-dev libcurl4-openssl-dev
      - name: Configure
        run: >-
          cmake -S . -B build/linux-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DONION_ENABLE_OPENCL=OFF -DONION_ENABLE_ASAN=ON -DONION_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build/linux-asan
      - name: Test
        run: ctest --test-dir build/linux-asan --output-on-failure

  llm-tsan:
    name: LLM client (Linux TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libcurl
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev
      - name: Configure
        run: >-
          cmake -S . -B build/linux-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DONION_ENABLE_OPENCL=OFF -DONION_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build/linux-tsan
      - name: LLM client tests
        run: >-
          ctest --test-dir build/linux-tsan --output-on-failure
          -R '^(Budget|Metering|CircuitBreaker|llm\.)'

  legacy:
    name: Legacy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cmake_args: ''
            install_pocl: true
          - name: macOS
            os: macos-latest
            cmake_args: -DDEPOT_OPENCL=OFF
            install_pocl: false
    env:
      POCL_CACHE_DIR: ${{ github.workspace }}/legacy/build/pocl-cache
    steps:
      - uses: actions/checkout@v4
      - name: Restore CMake download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            legacy/build/_deps
          key: legacy-cmake-${{ runner.os }}-${{ hashFiles('legacy/CMakeLists.txt') }}
      - name: Install Linux OpenCL runtime
        if: matrix.install_pocl
        run: sudo apt-get update && sudo apt-get install --yes pocl-opencl-icd ocl-icd-opencl-dev
      - name: Configure
        run: cmake -S legacy -B legacy/build -G Ninja ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build legacy/build
      - name: Test
        run: ctest --test-dir legacy/build --output-on-failure
      - name: Test controller
        working-directory: legacy
        run: python3 -m unittest test_controller.py
